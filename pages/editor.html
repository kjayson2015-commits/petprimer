<!--meta {"path": "/editor/", "nav": "", "title": "Editor | Pet Primer", "description": "Pet Primer editor.", "schema": "page", "noindex": true, "bare": true}-->
<style>
.ed { display: flex; flex-wrap: wrap; min-height: 100vh; background: #F3F4F1; font-size: 15px; }
.ed-side { flex: 1 1 230px; max-width: 260px; background: #E9ECE7; padding: 18px 14px; display: flex; flex-direction: column; gap: 14px; }
.ed-side .grp { display: flex; flex-direction: column; gap: 2px; }
.ed-side .lbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5A655F; padding: 0 8px 4px; }
.ed-side button.nav { display: flex; justify-content: space-between; align-items: center; min-height: 36px; padding: 0 10px; font: inherit; text-align: left; border: 0; border-radius: 8px; background: transparent; color: var(--ink); cursor: pointer; }
.ed-side button.nav[aria-pressed="true"] { background: #fff; font-weight: 700; }
.ed-list { flex: 1 1 280px; max-width: 340px; background: #FAFBF9; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.ed-list .head { padding: 18px 16px 10px; border-bottom: 1px solid var(--line); }
.ed-list button.item { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; font: inherit; text-align: left; border: 0; border-bottom: 1px solid #E8EBE6; background: transparent; color: var(--ink); cursor: pointer; }
.ed-list button.item[aria-pressed="true"] { background: #fff; }
.ed-main { flex: 999 1 560px; min-width: 0; background: #fff; display: flex; flex-direction: column; }
.ed-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 24px; border-bottom: 1px solid var(--line); }
.ed-bar label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.ed-bar select, .ed-seo input, .ed-seo textarea, .ed-claim input, .ed-claim select, .ed-write .meta-in { font: inherit; font-weight: 400; border: 1px solid #C9D0CB; border-radius: 8px; padding: 0 10px; min-height: 38px; background: #fff; color: var(--ink); }
.ed-seo textarea, .ed-write textarea.small-ta { padding: 8px 10px; resize: vertical; }
.ed-cols { display: flex; flex-wrap: wrap; flex: 1; }
.ed-write { flex: 999 1 420px; min-width: 0; padding: 24px 28px 48px; display: flex; flex-direction: column; gap: 14px; }
.ed-write .title-in { font-family: var(--display); font-weight: 700; font-size: 30px; border: 0; padding: 4px 0; color: var(--ink); background: transparent; }
.ed-write .body-in { font: inherit; font-size: 16px; line-height: 1.7; border: 0; padding: 0; resize: vertical; min-height: 320px; color: var(--ink); background: transparent; }
.ed-seo { flex: 1 1 300px; max-width: 380px; background: #FAFBF9; border-left: 1px solid var(--line); padding: 22px 20px 48px; display: flex; flex-direction: column; gap: 14px; }
.ed-seo label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; }
.ed-claim { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; background: var(--ground); border-radius: 10px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.check .dot { flex: none; width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; }
.gate { max-width: 460px; margin: 12vh auto; background: #fff; border: 1px solid var(--line-2); border-radius: 18px; padding: 32px; display: flex; flex-direction: column; gap: 14px; }
.wl { color: var(--accent); font-weight: 600; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.wl-missing { color: #8A5A12; font-weight: 600; text-decoration: underline dashed; text-underline-offset: 3px; }
.wl-suggest { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; background: #fff; border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 12px 30px rgba(27,36,32,.14); display: flex; flex-direction: column; max-height: 320px; overflow: auto; }
.wl-suggest button { display: flex; justify-content: space-between; gap: 12px; align-items: center; text-align: left; padding: 10px 14px; border: 0; border-bottom: 1px solid #EEF0EC; background: #fff; font: inherit; cursor: pointer; }
.wl-suggest button:hover, .wl-suggest button:focus { background: #F0F4EF; }
.ed-side .lbl { margin-top: 2px; }
.ed-seo button.item { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; font: inherit; color: var(--ink); cursor: pointer; }
.ed-seo button.item:hover { border-color: var(--accent) !important; }
</style>
<div data-editor><div class="gate"><p class="muted">Loading the editor…</p></div></div>
