<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>(function(){try{var t=localStorage.getItem('pp-theme');if(location.pathname.indexOf('/editor')===0)t='light';if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:site_name" content="Pet Primer">
<meta property="og:type" content="{{ogType}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@PetPrimer1">
<meta name="theme-color" content="#1F4D36" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101613" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/assets/img/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/img/icon-180.png">
<link rel="preload" href="/assets/fonts/public-sans-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css?v={{version}}">
<script src="/assets/js/config.js?v={{version}}"></script>
